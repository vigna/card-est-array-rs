[package]
name = "card-est-array"
version = "0.6.0"
edition = "2024"
description = "Infrastructure for managing large arrays of cardinality estimators."
repository = "https://github.com/vigna/card-est-array-rs"
license = "Apache-2.0 OR MIT"
readme = "README.md"
keywords = ["cardinality", "estimator"]
categories = ["data-structures", "algorithms"]
authors = [
	"Matteo Dell'Acqua <dellacqua.matteo99@gmail.com>",
	"Sebastiano Vigna <sebastiano.vigna@unimi.it>",
]
rust-version = "1.85"

[features]
slow_tests = []

[dependencies]
num-primitive = "=0.2.1"
sync-cell-slice = "0.9.12"
dsi-bitstream = "0.9"

[dev-dependencies]
anyhow = "1.0"
criterion = { version = "0.5", features = ["html_reports"] }
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }

[profile.bench]
opt-level = 3            # like --release
lto = "fat"              # Full LTO
overflow-checks = false  # Disable integer overflow checks.
debug = true             # Include debug info.
debug-assertions = false # Disable debug assertions.
codegen-units = 1        # slower compile times, but maybe better perf

[[bench]]
name = "bench_estimate"
harness = false

[[bench]]
name = "bench_add_merge"
harness = false
